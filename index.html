
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onze dansen - The Footloose Star Dancers</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 16px;
  font-family: Arial, sans-serif;
  background: #f2f5fa;
  color: #173b70;
}

.container {
  max-width: 1100px;
  margin: auto;
}

header {
  background: #173b70;
  color: white;
  text-align: center;
  padding: 22px 12px;
  border-radius: 12px;
  margin-bottom: 20px;
}

header h1 {
  margin: 0 0 8px;
  font-size: 27px;
}

header p { margin: 0; }

#zoek {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: 2px solid #214a87;
  border-radius: 10px;
  margin-bottom: 14px;
}

#letters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 16px;
}

.letter {
  padding: 9px 13px;
  border: 1px solid #214a87;
  border-radius: 7px;
  background: white;
  color: #173b70;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

.letter.actief {
  background: #173b70;
  color: white;
}

#status {
  margin: 12px 0;
  color: #555;
}

.dans {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 13px;
  border-left: 5px solid #b22222;
  box-shadow: 0 2px 7px rgba(0,0,0,.07);
}

.dans h2 {
  margin: 0 0 10px;
  font-size: 21px;
}

.info {
  color: #444;
  line-height: 1.7;
  margin-bottom: 13px;
}

.knoppen {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.linkknop {
  display: inline-block;
  background: #173b70;
  color: white;
  text-decoration: none;
  padding: 12px 15px;
  border-radius: 8px;
  font-weight: bold;
}

.linkknop:hover { background: #b22222; }

.geenlink {
  color: #777;
  font-size: 14px;
}

@media (max-width: 600px) {
  body { padding: 9px; }
  header { padding: 20px 10px; }
  header h1 { font-size: 23px; }
  .dans { padding: 14px; }
  .dans h2 { font-size: 20px; }
  .letter { padding: 9px 11px; }
  .linkknop {
    width: 100%;
    text-align: center;
  }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Onze dansen</h1>
  <p>Ontdek onze linedances, muziek en dansvideo's</p>
</header>

<input id="zoek" type="search" placeholder="Zoek een dansnaam...">

<div id="letters"></div>
<div id="status">Dansen worden geladen...</div>
<div id="lijst"></div>

</div>

<script>
const CSV_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vSYG4XzDwu4i0qIeLzldyCvl-G8e2Srmqp1olPswI699VROykExsAW83wO8E4qAJRCeYQMReAbTh06z/pub?gid=0&single=true&output=csv';

let dansen = [];
let gekozenLetter = 'Alles';

function csvRegels(tekst) {
  const regels = [];
  let regel = [];
  let veld = '';
  let aanhaling = false;

  for (let i = 0; i < tekst.length; i++) {
    const c = tekst[i];

    if (c === '"' && aanhaling && tekst[i + 1] === '"') {
      veld += '"';
      i++;
    } else if (c === '"') {
      aanhaling = !aanhaling;
    } else if (c === ',' && !aanhaling) {
      regel.push(veld.trim());
      veld = '';
    } else if ((c === '\n' || c === '\r') && !aanhaling) {
      if (c === '\r' && tekst[i + 1] === '\n') i++;
      regel.push(veld.trim());
      if (regel.some(v => v !== '')) regels.push(regel);
      regel = [];
      veld = '';
    } else {
      veld += c;
    }
  }

  regel.push(veld.trim());
  if (regel.some(v => v !== '')) regels.push(regel);

  return regels;
}

function waarde(d, namen) {
  for (const naam of namen) {
    const sleutel = Object.keys(d).find(
      k => k.trim().toUpperCase() === naam.toUpperCase()
    );

    if (sleutel && d[sleutel]) return d[sleutel].trim();
  }
  return '';
}

function veiligLink(url) {
  try {
    const u = new URL(url);
    return ['https:', 'http:'].includes(u.protocol) ? u.href : '';
  } catch {
    return '';
  }
}

function maakLetters() {
  const letters = [...new Set(
    dansen.map(d =>
      waarde(d, ['DANSNAAM']).charAt(0).toUpperCase()
    ).filter(Boolean)
  )].sort();

  const balk = document.getElementById('letters');
  balk.innerHTML = '';

  const keuzes = ['Alles', ...letters];

  keuzes.forEach(letter => {
    const knop = document.createElement('button');
    knop.className = 'letter' +
      (gekozenLetter === letter ? ' actief' : '');
    knop.textContent = letter;

    knop.onclick = () => {
      gekozenLetter = letter;
      maakLetters();
      toonLijst();
    };

    balk.appendChild(knop);
  });
}

function toonLijst() {
  const zoekterm = document.getElementById('zoek')
    .value.trim().toLowerCase();

  const resultaten = dansen.filter(d => {
    const naam = waarde(d, ['DANSNAAM']).toLowerCase();

    return naam.includes(zoekterm) &&
      (gekozenLetter === 'Alles' ||
       naam.toUpperCase().startsWith(gekozenLetter));
  });

  document.getElementById('status').textContent =
    resultaten.length + ' dans(en) gevonden';

  const lijst = document.getElementById('lijst');
  lijst.innerHTML = '';

  resultaten.forEach(d => {
    const kaart = document.createElement('div');
    kaart.className = 'dans';

    const naam = document.createElement('h2');
    naam.textContent = waarde(d, ['DANSNAAM']);
    kaart.appendChild(naam);

    const info = document.createElement('div');
    info.className = 'info';

    const regels = [];
    const titel = waarde(d, ['TITEL']);
    const artiest = waarde(d, ['ARTIEST']);
    const niveau = waarde(d, ['NIVEAU']);
    const tellen = waarde(d, ['AANTAL TELLEN', 'AANTAL_TELLEN']);

    if (titel) regels.push('Muziek: ' + titel);
    if (artiest) regels.push('Artiest: ' + artiest);
    if (niveau) regels.push('Niveau: ' + niveau);
    if (tellen) regels.push('Aantal tellen: ' + tellen);

    info.textContent = regels.join(' | ');
    kaart.appendChild(info);

    const knoppen = document.createElement('div');
    knoppen.className = 'knoppen';

    const link1 = veiligLink(waarde(d, ['LINK']));
    const link2 = veiligLink(waarde(d, ['LINK 2']));

    function voegKnopToe(url, tekst) {
      if (!url) return;

      const a = document.createElement('a');
      a.className = 'linkknop';
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = tekst;
      knoppen.appendChild(a);
    }

    voegKnopToe(link1, 'BEKIJK STEPSHEET / DANS');
    voegKnopToe(link2, 'BEKIJK TWEEDE LINK');

    if (knoppen.children.length) {
      kaart.appendChild(knoppen);
    } else {
      const melding = document.createElement('span');
      melding.className = 'geenlink';
      melding.textContent = 'Nog geen link beschikbaar';
      kaart.appendChild(melding);
    }

    lijst.appendChild(kaart);
  });
}

document.getElementById('zoek')
  .addEventListener('input', toonLijst);

fetch(CSV_URL)
  .then(response => {
    if (!response.ok) throw new Error('Spreadsheet niet bereikbaar');
    return response.text();
  })
  .then(tekst => {
    const regels = csvRegels(tekst);
    const koppen = regels.shift();

    dansen = regels.map(regel => {
      const d = {};
      koppen.forEach((kop, i) => {
        d[kop.trim()] = regel[i] || '';
      });
      return d;
    }).filter(d => waarde(d, ['DANSNAAM']));

    dansen.sort((a, b) =>
      waarde(a, ['DANSNAAM']).localeCompare(
        waarde(b, ['DANSNAAM']), 'nl'
      )
    );

    maakLetters();
    toonLijst();
  })
  .catch(error => {
    document.getElementById('status').textContent =
      'De dansgegevens konden niet geladen worden. Controleer of tabblad DANSEN gepubliceerd is.';
  });
</script>

</body>
</html>
