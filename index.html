
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onze dansen - The Footloose Star Dancers</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f1f4fa;
  color: #193e70;
}

.container {
  max-width: 1000px;
  margin: auto;
}

header {
  background: #193e70;
  color: white;
  text-align: center;
  padding: 24px 12px;
  border-radius: 14px;
  margin-bottom: 20px;
}

header h1 { margin: 0 0 8px; }

header p { margin: 0; }

input {
  width: 100%;
  padding: 15px;
  font-size: 18px;
  border: 2px solid #244d83;
  border-radius: 10px;
  margin-bottom: 14px;
}

.letters {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 18px;
}

.letters button, .linkbutton {
  border: 1px solid #193e70;
  background: white;
  color: #193e70;
  border-radius: 8px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
}

.letters button.active,
.linkbutton {
  background: #193e70;
  color: white;
}

#count {
  margin: 12px 0;
  color: #555;
}

.dance {
  background: white;
  border-left: 5px solid #c62828;
  border-radius: 12px;
  padding: 17px;
  margin-bottom: 13px;
  box-shadow: 0 2px 7px #00000012;
}

.dance h2 {
  margin: 0 0 10px;
  font-size: 21px;
}

.details {
  color: #444;
  line-height: 1.6;
  margin-bottom: 12px;
}

.links {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}

.linkbutton {
  display: inline-block;
  text-decoration: none;
  padding: 11px 15px;
}

.linkbutton:hover {
  background: #c62828;
}

.status {
  text-align: center;
  padding: 25px;
  color: #555;
}

@media (max-width: 600px) {
  body { padding: 10px; }
  header { padding: 20px 10px; }
  header h1 { font-size: 25px; }
  input { font-size: 17px; }
  .letters { gap: 6px; }
  .letters button { padding: 10px 12px; }
  .dance { padding: 14px; }
  .dance h2 { font-size: 20px; }
  .linkbutton { width: 100%; text-align: center; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>Onze dansen</h1>
  <p>Ontdek onze linedances, muziek en dansvideo's</p>
</header>

<input id="search" type="search" placeholder="Zoek een dansnaam...">

<div class="letters" id="letters"></div>

<div id="count">Dansen worden geladen...</div>
<div id="list" class="status">Even geduld...</div>

</div>

<script>
const csvUrl =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSYG4XzDwu4i0qIeLzldyCvl-G8e2Srmqp1olPswI699VROykExsAW83wO8E4qAJRCeYQMReAbTh06z/pub?gid=86558985&single=true&output=csv";

let dances = [];
let selectedLetter = "Alles";

function parseCSV(text) {
  const rows = [];
  let row = [], value = "", quoted = false;

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"' && quoted && text[i + 1] === '"') {
      value += '"';
      i++;
    } else if (c === '"') {
      quoted = !quoted;
    } else if (c === "," && !quoted) {
      row.push(value.trim());
      value = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(value.trim());
      if (row.some(v => v !== "")) rows.push(row);
      row = [];
      value = "";
    } else {
      value += c;
    }
  }

  row.push(value.trim());
  if (row.some(v => v !== "")) rows.push(row);
  return rows;
}

function safeUrl(value) {
  try {
    const url = new URL(value);
    return ["https:", "http:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function makeLetters() {
  const letters = ["Alles", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  const area = document.getElementById("letters");
  area.innerHTML = "";

  letters.forEach(letter => {
    const button = document.createElement("button");
    button.textContent = letter;
    button.className = selectedLetter === letter ? "active" : "";

    button.onclick = () => {
      selectedLetter = letter;
      makeLetters();
      render();
    };

    area.appendChild(button);
  });
}

function render() {
  const search = document.getElementById("search").value
    .trim().toLowerCase();

  const filtered = dances.filter(d => {
    const name = (d.name || "").toLowerCase();
    const matchesSearch = name.includes(search);
    const matchesLetter =
      selectedLetter === "Alles" ||
      name.toUpperCase().startsWith(selectedLetter);

    return matchesSearch && matchesLetter;
  });

  document.getElementById("count").textContent =
    filtered.length + " dans(en) gevonden";

  const list = document.getElementById("list");
  list.className = "";
  list.innerHTML = "";

  if (!filtered.length) {
    list.textContent = "Geen dansen gevonden.";
    return;
  }

  filtered.forEach(d => {
    const card = document.createElement("article");
    card.className = "dance";

    const title = document.createElement("h2");
    title.textContent = d.name;
    card.appendChild(title);

    const details = document.createElement("div");
    details.className = "details";

    const info = [];
    if (d.title) info.push("Muziek: " + d.title);
    if (d.artist) info.push("Artiest: " + d.artist);
    if (d.level) info.push("Niveau: " + d.level);
    if (d.count) info.push("Aantal tellen: " + d.count);

    details.textContent = info.join(" | ");
    card.appendChild(details);

    const links = document.createElement("div");
    links.className = "links";

    if (d.link) {
      const a = document.createElement("a");
      a.className = "linkbutton";
      a.href = d.link;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "BEKIJK STEPSHEET";
      links.appendChild(a);
    }

    if (d.video) {
      const a = document.createElement("a");
      a.className = "linkbutton";
      a.href = d.video;
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = "BEKIJK DANSVIDEO";
      links.appendChild(a);
    }

    if (links.children.length) {
      card.appendChild(links);
    } else {
      details.textContent +=
        (info.length ? " | " : "") + "Nog geen link beschikbaar";
    }

    list.appendChild(card);
  });
}

async function loadDances() {
  try {
    const response = await fetch(csvUrl);

    if (!response.ok) throw new Error("Spreadsheet niet bereikbaar");

    const text = await response.text();
    const rows = parseCSV(text);

    dances = rows.slice(1).map(row => ({
      name: row[0] || "",
      title: row[1] || "",
      artist: row[2] || "",
      level: row[3] || "",
      count: row[4] || "",
      link: safeUrl(row[5] || ""),
      video: safeUrl(row[6] || "")
    })).filter(d => d.name);

    dances.sort((a, b) =>
      a.name.localeCompare(b.name, "en")
    );

    makeLetters();
    render();

  } catch (error) {
    document.getElementById("list").textContent =
      "De dansenlijst kon niet worden geladen. Controleer de publicatie van het Google-spreadsheet.";
    document.getElementById("count").textContent = "";
  }
}

document.getElementById("search").addEventListener("input", render);

loadDances();
</script>
</body>
</html>
